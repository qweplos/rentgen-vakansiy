<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ХаХантер</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <span class="mark">Ха</span>
  <b>ХаХантер</b>
</header>

<section>
  <h2>Что скрывать</h2>
  <div id="filters"></div>
</section>

<section>
  <h2>Реклама hh.ru</h2>
  <label class="opt"><input type="checkbox" id="hideAds"> Скрывать рекламу: баннеры, курсы с промокодами</label>
</section>

<section>
  <h2>Тема hh.ru</h2>
  <select id="siteTheme">
    <option value="site">Как на сайте</option>
    <option value="night">Тёмная</option>
    <option value="system">Как в системе</option>
  </select>
</section>

<section>
  <h2>Сортировка выдачи</h2>
  <select id="sort">
    <option value="score">Сначала лучшие</option>
    <option value="hh">Как на hh</option>
  </select>
</section>

<section>
  <h2>Важность факторов</h2>
  <div id="weights"></div>
  <button id="reset" type="button">Сбросить важность</button>
</section>

<p class="foot">Изменения сразу применяются на открытых страницах hh.ru. Настройки хранятся только в вашем браузере. Независимый проект, не связан с HeadHunter.</p>

<script src="../src/score.js"></script>
<script src="popup.js"></script>
</body>
</html>
